<script>
(function(){
'use strict';
window.addEventListener('error',function(e){document.documentElement.setAttribute('data-err',String(e.message)+' @'+(e.lineno||0));});
/* ---------------- constants ---------------- */
const W=1920,H=1080;
const DPR=Math.min(1.5,window.devicePixelRatio||1);
const TEXT='Welcome to DeepSeek';
const FONT_PX=152;
const BASELINE=566;
const WHALE_X=596,WHALE_Y=380,WHALE_W=340,WHALE_S=WHALE_W/26.634;
const WM_X=988,WM_Y=466,WM_SCALE=3;
const CENTER_DX=960-(WHALE_X+WHALE_W/2);

const T0=0.78;                 // pen appears
const W_START=1.0,W_END=6.1;    // writing
const PEN_OUT=6.62;
const FADE_S=7.62,FADE_E=8.42;  // handwriting fade out
const D_START=8.28,D_END=10.34; // whale outline drawn
const FILL_S=10.4,FILL_E=11.24;
const RIM_S=10.96,RIM_E=11.5;
const WORD_S=11.05,WORD_E=11.95;
const SUB_S=12.08,SUB_E=12.98;
const HOP_S=12.14,HOP_E=13.02;
const END=16.2;

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>-(Math.cos(Math.PI*x)-1)/2;

/* ---------------- dom ---------------- */
const stage=document.getElementById('stage');
const halo=document.getElementById('halo');
const canvas=document.getElementById('ink');
const ctx=canvas.getContext('2d');
const lockupSvg=document.getElementById('lockupSvg');
const lockupG=document.getElementById('lockupG');
const whaleAnim=document.getElementById('whaleAnim');
const whaleRoot=document.getElementById('whaleRoot');
const whaleFill=document.getElementById('whaleFill');
const rimWide=document.getElementById('rimWide');
const rimCore=document.getElementById('rimCore');
const wordG=document.getElementById('wordG');
const sub=document.getElementById('sub');
const ref=document.getElementById('whaleRef');

canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);

/* ---------------- stage fit ---------------- */
function fit(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  stage.style.transform='translate(-50%,-50%) scale('+s+')';
}
window.addEventListener('resize',fit); fit();

/* ---------------- offscreen ---------------- */
const ink=document.createElement('canvas'); ink.width=canvas.width; ink.height=canvas.height;
const inkCtx=ink.getContext('2d');
const mask=document.createElement('canvas'); mask.width=canvas.width; mask.height=canvas.height;
const maskCtx=mask.getContext('2d');
maskCtx.setTransform(DPR,0,0,DPR,0,0);

let textX=0,textW=0,penPath=null,penStartX=0,penEndX=0;
let whalePts=null,whaleJumps=null,whaleLen=0;

/* brush sprite */
const BRUSH_RX=27,BRUSH_RY=132,BRUSH_ROT=-0.24;
const brush=document.createElement('canvas'); brush.width=256; brush.height=256;
(function(){
  const c=brush.getContext('2d');
  const g=c.createRadialGradient(128,128,0,128,128,128);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.4,'rgba(255,255,255,1)');
  g.addColorStop(.62,'rgba(255,255,255,.86)');
  g.addColorStop(.82,'rgba(255,255,255,.38)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g; c.fillRect(0,0,256,256);
})();

/* ---------------- build ink ---------------- */
const WORD_GAP=17;
let wordLayout=[];
function layoutPhrase(c){
  const parts=TEXT.split(' ');
  const spaceW=c.measureText(' ').width;
  let total=0;
  parts.forEach((p,i)=>{ total+=c.measureText(p).width+(i<parts.length-1?spaceW+WORD_GAP:0); });
  let x=(W-total)/2;
  wordLayout=parts.map((p,i)=>{
    const o={t:p,x};
    x+=c.measureText(p).width+(i<parts.length-1?spaceW+WORD_GAP:0);
    return o;
  });
  return total;
}
function fillPhrase(c){ for(const w of wordLayout) c.fillText(w.t,w.x,BASELINE); }

async function buildInk(){
  try{ await document.fonts.load(FONT_PX+'px Sacramento'); }catch(e){}
  await document.fonts.ready;
  inkCtx.setTransform(DPR,0,0,DPR,0,0);
  inkCtx.clearRect(0,0,W,H);
  inkCtx.font=FONT_PX+"px 'Sacramento', cursive";
  inkCtx.textBaseline='alphabetic';
  inkCtx.textAlign='left';
  textW=layoutPhrase(inkCtx);
  textX=(W-textW)/2;
  const g=inkCtx.createLinearGradient(0,BASELINE-FONT_PX*0.95,0,BASELINE+FONT_PX*0.22);
  g.addColorStop(0,'#F2F7FF');
  g.addColorStop(.55,'#DCE9FF');
  g.addColorStop(1,'#B4CBF5');

  /* glow pass */
  inkCtx.save();
  inkCtx.globalCompositeOperation='lighter';
  for(const [blur,alpha] of [[34,.22],[16,.26],[6,.3]]){
    inkCtx.shadowColor='rgba(92,140,255,'+alpha+')';
    inkCtx.shadowBlur=blur*DPR;
    inkCtx.fillStyle='#B9D0FF';
    fillPhrase(inkCtx);
  }
  inkCtx.restore();

  /* core pass */
  inkCtx.fillStyle=g;
  fillPhrase(inkCtx);

  buildPenPath();
  buildWhalePath();
}

/* ---------------- pen path from ink ---------------- */
function buildPenPath(){
  const m=document.createElement('canvas'); m.width=W; m.height=H;
  const mc=m.getContext('2d',{willReadFrequently:true});
  mc.font=FONT_PX+"px 'Sacramento', cursive";
  mc.textBaseline='alphabetic';
  mc.fillStyle='#fff';
  fillPhrase(mc);
  const x0=Math.max(0,Math.floor(textX)-24), x1=Math.min(W-1,Math.ceil(textX+textW)+24);
  const y0=Math.max(0,Math.floor(BASELINE-FONT_PX*1.25)), y1=Math.min(H-1,Math.ceil(BASELINE+FONT_PX*0.45));
  const data=mc.getImageData(x0,y0,x1-x0,y1-y0).data;
  const yb=new Float32Array(x1-x0);
  const has=new Uint8Array(x1-x0);
  for(let x=0;x<x1-x0;x++){
    let sa=0, sy=0;
    for(let y=0;y<y1-y0;y++){
      const a=data[(y*(x1-x0)+x)*4+3];
      if(a>8){ sa+=a; sy+=(y+y0)*a; }
    }
    if(sa>400){ yb[x]=sy/sa; has[x]=1; }
  }
  /* fill gaps + edges + smooth */
  let first=-1,last=-1;
  for(let x=0;x<yb.length;x++){ if(has[x]){ if(last>=0){ for(let k=last+1;k<x;k++) yb[k]=lerp(yb[last],yb[x],(k-last)/(x-last)); } else first=x; last=x; } }
  if(last<0){ yb.fill(BASELINE-FONT_PX*0.3); first=0; last=yb.length-1; }
  for(let x=0;x<first;x++) yb[x]=yb[first];
  for(let x=last+1;x<yb.length;x++) yb[x]=yb[last];
  for(let pass=0;pass<3;pass++){
    const src=Float32Array.from(yb); const R=9;
    for(let x=0;x<yb.length;x++){
      let s=0,n=0;
      for(let k=-R;k<=R;k++){ const j=x+k; if(j>=0&&j<yb.length){ s+=src[j]; n++; } }
      yb[x]=s/n;
    }
  }
  penPath={x0,yb};
  penStartX=Math.max(x0+1,x0+first-9);
  penEndX=Math.min(x0+yb.length-2,x0+last+11);
}
function penY(x){
  if(!penPath) return BASELINE;
  const f=x-penPath.x0, i=Math.floor(f), a=f-i;
  const arr=penPath.yb;
  const y0=arr[clamp(i,0,arr.length-1)], y1=arr[clamp(i+1,0,arr.length-1)];
  return lerp(y0,y1,a);
}
function penAt(tt){
  const u=clamp((tt-W_START)/(W_END-W_START),0,1);
  const p=0.18*u+0.82*easeInOut(u);
  const x=lerp(penStartX,penEndX,p);
  return {x,y:penY(x)};
}
const penXAt=t=>penAt(t).x;

/* ---------------- mask stamping ---------------- */
let lastStampX=penStartX;
function stamp(x){
  const y=penY(x);
  maskCtx.save();
  maskCtx.translate(x,y);
  maskCtx.rotate(BRUSH_ROT);
  maskCtx.scale(BRUSH_RX/128,BRUSH_RY/128);
  maskCtx.drawImage(brush,-128,-128,256,256);
  maskCtx.restore();
}
function stampTo(x){
  if(x<=lastStampX) { lastStampX=Math.max(lastStampX,x); return; }
  for(let s=lastStampX;s<=x;s+=1.6) stamp(s);
  stamp(x);
  lastStampX=x;
}
function resetMask(t){
  maskCtx.setTransform(DPR,0,0,DPR,0,0);
  maskCtx.clearRect(0,0,W,H);
  lastStampX=penStartX;
  if(t>W_START){
    const xe=Math.min(penXAt(t),penEndX);
    for(let s=penStartX;s<=xe;s+=1.6) stamp(s);
    lastStampX=xe;
  }
}

/* ---------------- whale path ---------------- */
function buildWhalePath(){
  const L=ref.getTotalLength(); whaleLen=L;
  const N=1500, pts=new Float32Array(N*2), jump=new Uint8Array(N);
  for(let i=0;i<N;i++){
    const pt=ref.getPointAtLength(i/N*L);
    pts[i*2]=WHALE_X+(pt.x-0.163)*WHALE_S;
    pts[i*2+1]=WHALE_Y+(pt.y-1.75)*WHALE_S;
    if(i>0){
      const dx=pts[i*2]-pts[i*2-2], dy=pts[i*2+1]-pts[i*2-1];
      if(dx*dx+dy*dy>16) jump[i]=1;
    }
  }
  whalePts=pts; whaleJumps=jump;
  jump[0]=1; /* the path's end→start is a pen lift, not a line */
  /* start the stroke at the top of the body (left half) */
  const bodyMaxX=WHALE_X+13*WHALE_S;
  let k=0,best=1e9,bestX=1e9;
  for(let i=0;i<N;i++){
    const y=pts[i*2+1], x=pts[i*2];
    if(x>bodyMaxX) continue;
    if(y<best-0.5 || (Math.abs(y-best)<=0.5 && x<bestX)){ best=y; bestX=x; k=i; }
  }
  const pts2=new Float32Array(N*2), jmp2=new Uint8Array(N);
  for(let i=0;i<N;i++){
    const j=(k+i)%N;
    pts2[i*2]=pts[j*2]; pts2[i*2+1]=pts[j*2+1];
    jmp2[i]= i===0?1:jump[j];
  }
  whalePts=pts2; whaleJumps=jmp2;
}

/* ---------------- drawing ---------------- */
function drawPen(x,y,alpha){
  if(alpha<=0.001) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(x,y,0,x,y,110);
  g.addColorStop(0,'rgba(96,142,255,'+(.26*alpha)+')');
  g.addColorStop(.35,'rgba(70,118,255,'+(.10*alpha)+')');
  g.addColorStop(1,'rgba(50,80,220,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,110,0,6.2832); ctx.fill();

  g=ctx.createRadialGradient(x,y,0,x,y,20);
  g.addColorStop(0,'rgba(255,255,255,'+(.95*alpha)+')');
  g.addColorStop(.3,'rgba(224,238,255,'+(.7*alpha)+')');
  g.addColorStop(1,'rgba(150,190,255,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,20,0,6.2832); ctx.fill();

  ctx.fillStyle='rgba(255,255,255,'+(.92*alpha)+')';
  ctx.beginPath(); ctx.arc(x,y,2.1,0,6.2832); ctx.fill();
  ctx.restore();
}

function drawTrail(t,alpha){
  if(alpha<=0.001) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let k=1;k<=13;k++){
    const tt=t-k*0.0115;
    if(tt<W_START) break;
    const p=penAt(tt);
    const f=(1-k/14);
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,26);
    g.addColorStop(0,'rgba(180,212,255,'+(.10*f*alpha)+')');
    g.addColorStop(1,'rgba(120,160,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,26,0,6.2832); ctx.fill();
  }
  ctx.restore();
}

function penAlpha(t){
  const on=smooth(T0,T0+0.34,t);
  const off=1-smooth(PEN_OUT-0.42,PEN_OUT,t);
  return Math.min(on,off);
}

function drawText(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(t<W_START-0.02) return;
  stampTo(Math.min(penXAt(t),penEndX));
  ctx.drawImage(ink,0,0,W,H);
  ctx.globalCompositeOperation='destination-in';
  ctx.drawImage(mask,0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const pa=penAlpha(t);
  if(t<W_END+0.35){
    const p=penAt(t);
    drawTrail(t,pa);
    drawPen(p.x,p.y,pa);
  }else{
    const p=penAt(W_END);
    const lift=clamp((t-W_END)/0.35,0,1);
    drawPen(p.x+lift*10,p.y-lift*8,1-lift);
  }
  ctx.globalCompositeOperation='source-over';
}

function drawWhaleOutline(t,dx){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  if(t>RIM_E) return;
  ctx.translate(dx,0);
  const u=clamp((t-D_START)/(D_END-D_START),0,1);
  const p=easeInOut(u);
  const n=Math.max(2,Math.floor(p*(whalePts.length/2-1)))+1;
  const fade=1-smooth(RIM_S,RIM_E,t);

  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  const passes=[[10,0.14],[5.5,0.30],[2.6,0.85],[1.1,1]];
  for(const [w,a] of passes){
    ctx.beginPath();
    ctx.moveTo(whalePts[0],whalePts[1]);
    for(let i=1;i<n;i++){ if(whaleJumps[i]) ctx.moveTo(whalePts[i*2],whalePts[i*2+1]); else ctx.lineTo(whalePts[i*2],whalePts[i*2+1]); }
    ctx.strokeStyle='rgba('+(w<1.2?'242,248,255':'150,185,255')+','+(a*fade)+')';
    ctx.lineWidth=w;
    ctx.stroke();
  }
  ctx.restore();

  /* pen head during the draw */
  if(t>D_START-0.02 && t<D_END+0.35){
    const idx=Math.min(n-1,Math.floor(p*(whalePts.length/2-1)));
    const hx=whalePts[idx*2], hy=whalePts[idx*2+1];
    const pa=smooth(D_START-0.05,D_START+0.24,t)*(1-smooth(D_END,D_END+0.3,t));
    if(t>D_END){ const l=clamp((t-D_END)/0.32,0,1); drawPen(hx+l*8,hy-l*6,1-l); }
    else drawPen(hx,hy,pa);
  }
}

/* ---------------- whale motion ---------------- */
function whaleDx(t){ return CENTER_DX*(1-smooth(10.5,11.6,t)); }
function whaleTransform(t){
  const dx=whaleDx(t);
  lockupG.setAttribute('transform','translate('+dx.toFixed(2)+',0)');
  let hop=0, ang=0, dy=0;
  if(t>HOP_S){
    const u=clamp((t-HOP_S)/(HOP_E-HOP_S),0,1);
    hop=-9*Math.sin(Math.PI*u)*Math.sin(Math.PI*u);
  }
  if(t>HOP_E-0.2){
    const s=t-11.9;
    const ramp=smooth(11.9,13.4,t);
    ang=1.05*ramp*Math.sin(2*Math.PI*s/4.6);
    dy=1.6*ramp*Math.sin(2*Math.PI*s/4.6+0.7);
  }
  const cx=WHALE_W*0.36, cy=WHALE_W*(19.6/26.634)*0.66;
  whaleAnim.setAttribute('transform','translate(0 '+(hop+dy).toFixed(2)+') rotate('+ang.toFixed(3)+' '+cx.toFixed(1)+' '+cy.toFixed(1)+')');
}

/* ---------------- master render ---------------- */
let cleared=false;
function render(t){
  /* handwriting canvas */
  if(t<FADE_E){
    const f=smooth(FADE_S,FADE_E,t);
    canvas.style.opacity=String(1-f);
    canvas.style.transform='translateY('+(-14*f).toFixed(2)+'px)';
    drawText(t);
    cleared=false;
  }else{
    canvas.style.transform='translateY(0)';
    canvas.style.opacity='1';
    if(t<RIM_E+0.1){ drawWhaleOutline(t,whaleDx(t)); cleared=false; }
    else if(!cleared){ ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H); cleared=true; }
  }

  /* whale fill / rim / wordmark / subtitle */
  const fillP=easeOut(clamp((t-FILL_S)/(FILL_E-FILL_S),0,1));
  whaleFill.setAttribute('fill-opacity',fillP.toFixed(4));
  const rimP=smooth(RIM_S,RIM_E,t);
  rimWide.setAttribute('opacity',(0.22*rimP).toFixed(3));
  rimCore.setAttribute('opacity',(0.92*rimP).toFixed(3));

  const wu=clamp((t-WORD_S)/(WORD_E-WORD_S),0,1);
  const we=easeOut(wu);
  wordG.setAttribute('opacity',we.toFixed(4));
  wordG.setAttribute('transform','translate('+(WM_X+18*(1-we)).toFixed(2)+','+WM_Y+') scale('+WM_SCALE+')');

  const su=clamp((t-SUB_S)/(SUB_E-SUB_S),0,1);
  const se=easeOut(su);
  sub.style.opacity=String(se);
  sub.style.transform='translateY('+(10*(1-se)).toFixed(2)+'px)';
  sub.style.letterSpacing=(0.62-0.2*se).toFixed(3)+'em';
  sub.style.textIndent=(0.62-0.2*se).toFixed(3)+'em';

  /* halo breathing */
  let hAlpha=0;
  if(t>FILL_S+0.4){
    const base=smooth(FILL_S+0.4,13.2,t);
    const s=t-12.4;
    const breath=0.5+0.5*Math.sin(2*Math.PI*s/5.4);
    hAlpha=base*(0.62+0.16*breath);
    const sc=1+0.035*(breath-0.5)*2*base;
    halo.style.opacity=hAlpha.toFixed(4);
    halo.style.transform='scale('+sc.toFixed(4)+')';
  }else{
    halo.style.opacity='0';
  }

  whaleTransform(t);
}

/* ---------------- clock ---------------- */
const params=new URLSearchParams(location.search);
const tRaw=parseFloat(params.get('t'));
const seek=Number.isFinite(tRaw)?tRaw:null;
let started=0,running=false,raf=0,lastT=0;
const PERF=params.has('perf');
const perfD=[];let lastNow=0;
function tick(now){
  if(!running) return;
  if(PERF&&lastNow){ const d=now-lastNow; if(d>0&&d<200) perfD.push(d); }
  lastNow=now;
  const t=(now-started)/1000;
  lastT=t;
  render(t);
  raf=requestAnimationFrame(tick);
}
function start(){
  cancelAnimationFrame(raf);
  if(seek!==null){ render(clamp(seek,0,END)); running=false; return; }
  resetMask(0);
  started=performance.now();
  running=true;
  render(0);
  raf=requestAnimationFrame(tick);
}
function replay(){ resetMask(0); start(); }

/* first frame / restart */
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
buildInk().then(()=>{
  document.documentElement.setAttribute('data-ready','1');
  render(0);
  if(reduce){ render(13.1); return; }
  if(seek!==null) render(clamp(seek,0,END));
  else start();
});

window.__seek=(t)=>{ resetMask(t); render(clamp(t,0,END)); };
window.__perf=()=>{
  if(!perfD.length) return null;
  const s=[...perfD].sort((a,b)=>a-b);
  return {n:s.length,median:+s[Math.floor(s.length/2)].toFixed(2),p95:+s[Math.floor(s.length*0.95)].toFixed(2),max:+s[s.length-1].toFixed(2)};
};

/* interactions */
window.addEventListener('pointerdown',()=>{ if(seek===null) replay(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space'||e.key==='r'||e.key==='R'){ e.preventDefault(); if(seek===null) replay(); } });
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ running=false; cancelAnimationFrame(raf); }
  else if(seek===null && !reduce && !running){
    started=performance.now()-lastT*1000; lastNow=0; running=true; raf=requestAnimationFrame(tick);
  }
});
})();
</script>
